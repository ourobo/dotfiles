[general]
import = [
    "~/.config/alacritty/theme/catppuccin-macchiato.toml"
]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
decorations = "Buttonless"
blur = true
opacity = 0.9
padding = { x = 5, y = 5 }

[font]
size = 14

[font.normal]
family = "Hack Nerd Font Mono"
style = "Regular"

[font.bold]
family = "Hack Nerd Font Mono"
style = "Bold"

[font.italic]
family = "Hack Nerd Font Mono"
style = "Italic"

[terminal]
shell.program = "/opt/homebrew/bin/tmux"
shell.args = ["new-session", "-A", "-D", "-s", "main"]
