# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                              TMUX CONFIGURATION                              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# GENERAL SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

# Reload configuration file with prefix + r
# Displays a confirmation message when reloaded
bind r source-file ~/.tmux.conf \; display "config reloaded"

# Enable mouse support for:
# - Clicking to select panes/windows
# - Dragging to resize panes
# - Scrolling through history
set -g mouse on

# Increase scrollback buffer size (default is 2000)
# Allows scrolling back through more terminal history
set -g history-limit 10000

# ══════════════════════════════════════════════════════════════════════════════
# INDEXING
# ══════════════════════════════════════════════════════════════════════════════

# Start window numbering at 1 instead of 0
# More intuitive as keyboard numbers start with 1 on the left
set -g base-index 1

# Start pane numbering at 1 instead of 0
# Consistent with window numbering
setw -g pane-base-index 1

# ══════════════════════════════════════════════════════════════════════════════
# STATUS BAR
# ══════════════════════════════════════════════════════════════════════════════

# Position status bar at the bottom of the screen
set -g status-position bottom

# Status bar colors: dark gray background with white text
set -g status-style "bg=colour236,fg=colour255"

# --- Left Side: Session Name ---
# Format:  SESSION_NAME
# Style: magenta background, black bold text
set -g status-left "#[bg=magenta,fg=black,bold]  #S #[default] "
set -g status-left-length 25

# --- Center: Window List ---
# Inactive windows: gray text with format "INDEX:NAME"
set -g window-status-format "#[fg=colour245] #I:#W "

# Active window: blue background, black bold text
set -g window-status-current-format "#[bg=blue,fg=black,bold] #I:#W #[default]"

# No separator between window entries (clean look)
set -g window-status-separator ""

# --- Right Side: Date and Time ---
# Format: MM-DD HH:MM
# Date in cyan, time in yellow bold
set -g status-right "#[fg=cyan] %m-%d #[fg=yellow,bold]%H:%M "

# ══════════════════════════════════════════════════════════════════════════════
# PANE BORDERS
# ══════════════════════════════════════════════════════════════════════════════

# Use heavy (thick) border lines for better visibility
set -g pane-border-lines heavy

# Display pane information at the top of each pane
set -g pane-border-status top

# Inactive pane border: dark gray
set -g pane-border-style "fg=colour240"

# Active pane border: magenta bold for emphasis
set -g pane-active-border-style "fg=magenta,bold"

# Pane title format: [window_name] pane_number : pane_title
# Active pane: yellow text
# Inactive pane: light gray text
# NOTE: Requires shell integration to display custom titles:
#   Add to .zshrc:
#     precmd()  { print -Pn "\e]0;%~\a" }      # Set title to current directory
#     preexec() { print -Pn "\e]0;$1\a" }      # Set title to running command
set -g pane-border-format "#{?pane_active,#[fg=yellow],#[fg=colour250]}[#W] #P : #{pane_title}#[default]"

# ══════════════════════════════════════════════════════════════════════════════
# KEY BINDINGS - NAVIGATION
# ══════════════════════════════════════════════════════════════════════════════

# Vim-style pane navigation (prefix + h/j/k/l)
# Much more intuitive than arrow keys
bind h select-pane -L    # Move to left pane
bind j select-pane -D    # Move to pane below
bind k select-pane -U    # Move to pane above
bind l select-pane -R    # Move to right pane

# Quick switch to last active window with prefix + Tab
# (Replaces default 'l' binding which we use for pane navigation)
bind Tab last-window

# ══════════════════════════════════════════════════════════════════════════════
# KEY BINDINGS - SPLITTING
# ══════════════════════════════════════════════════════════════════════════════

# Split panes using | and - (more intuitive than % and ")
# -c "#{pane_current_path}" preserves the current working directory

# Horizontal split (side by side): prefix + |
bind | split-window -h -c "#{pane_current_path}"

# Vertical split (top and bottom): prefix + -
bind - split-window -v -c "#{pane_current_path}"

# ══════════════════════════════════════════════════════════════════════════════
# KEY BINDINGS - PANE MANAGEMENT
# ══════════════════════════════════════════════════════════════════════════════

# Toggle synchronized input to all panes: prefix + s
# When enabled, keystrokes are sent to ALL panes in the current window
# Useful for running the same command on multiple servers
bind-key s setw synchronize-panes

# ══════════════════════════════════════════════════════════════════════════════
# KEY BINDINGS - COPY MODE
# ══════════════════════════════════════════════════════════════════════════════

# vi mode
set-window-option -g mode-keys vi
# Enter copy mode with 'v' and yank with 'y'
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel